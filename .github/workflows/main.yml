name: Deploy to NPM

on:
  push:
    branches: [ "main" ]

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@latest && node -v && npm -v

      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npx vitest run
        
      - name: Compile Code
        run: npm run build
        
      - name: Semantic Release
        id: release
        uses: cycjimmy/semantic-release-action@v8
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            conventional-changelog-conventionalcommits@8
          semantic_version: 25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        if: steps.release.outputs.new_release_published == 'true'
        run: npm publish